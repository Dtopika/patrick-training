name: Patrick Quality Gate

on:
  push:
    branches:
      - master
      - "fix/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: node --check scripts/release-version.mjs
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 >/tmp/patrick-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/patrick-http.log
          exit 1
      - run: npm run test:e2e
